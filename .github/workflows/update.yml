name: Update win-probabilities

# Result-triggered refresh (match-end schedule + change-gate). GitHub can't fire
# the instant a match ends and throttles high-frequency crons (*/15), so instead we
# schedule discrete checks ~5/35/65 min after every fixture's expected finish
# (see scripts/gen_schedule.py). Each run does the CHEAP collect + fingerprint and
# only runs the expensive 50k-sim + deploy when ESPN shows a NEW result/goal.
# These collapse onto :00/:30 UTC marks across the match window (18:00->07:00 UTC).
# GitHub's scheduler is UTC-only and can still be delayed a few minutes under load.
on:
  schedule:
    # Checks are anchored to real match-end times (+buffers) instead of */15,
    # which GitHub throttles/drops. Each run is the cheap change-gate; it only
    # deploys when a new result appears. Regenerate with scripts/gen_schedule.py.
    # SCHEDULE:START (generated by scripts/gen_schedule.py - do not edit by hand)
    - cron: "17 12 * 6,7 *"   # daily forced odds refresh (dead zone, no matches)
    - cron: "7 0 * 6,7 *"
    - cron: "19 0 * 6,7 *"
    - cron: "43 0 * 6,7 *"
    - cron: "7 1 * 6,7 *"
    - cron: "19 1 * 6,7 *"
    - cron: "37 1 * 6,7 *"
    - cron: "43 1 * 6,7 *"
    - cron: "49 1 * 6,7 *"
    - cron: "7 2 * 6,7 *"
    - cron: "13 2 * 6,7 *"
    - cron: "19 2 * 6,7 *"
    - cron: "37 2 * 6,7 *"
    - cron: "43 2 * 6,7 *"
    - cron: "49 2 * 6,7 *"
    - cron: "7 3 * 6,7 *"
    - cron: "13 3 * 6,7 *"
    - cron: "19 3 * 6,7 *"
    - cron: "37 3 * 6,7 *"
    - cron: "43 3 * 6,7 *"
    - cron: "49 3 * 6,7 *"
    - cron: "7 4 * 6,7 *"
    - cron: "13 4 * 6,7 *"
    - cron: "19 4 * 6,7 *"
    - cron: "43 4 * 6,7 *"
    - cron: "7 5 * 6,7 *"
    - cron: "19 5 * 6,7 *"
    - cron: "43 5 * 6,7 *"
    - cron: "7 6 * 6,7 *"
    - cron: "19 6 * 6,7 *"
    - cron: "43 6 * 6,7 *"
    - cron: "7 18 * 6,7 *"
    - cron: "19 18 * 6,7 *"
    - cron: "43 18 * 6,7 *"
    - cron: "7 19 * 6,7 *"
    - cron: "19 19 * 6,7 *"
    - cron: "43 19 * 6,7 *"
    - cron: "7 20 * 6,7 *"
    - cron: "19 20 * 6,7 *"
    - cron: "43 20 * 6,7 *"
    - cron: "7 21 * 6,7 *"
    - cron: "19 21 * 6,7 *"
    - cron: "43 21 * 6,7 *"
    - cron: "7 22 * 6,7 *"
    - cron: "19 22 * 6,7 *"
    - cron: "37 22 * 6,7 *"
    - cron: "43 22 * 6,7 *"
    - cron: "49 22 * 6,7 *"
    - cron: "7 23 * 6,7 *"
    - cron: "13 23 * 6,7 *"
    - cron: "19 23 * 6,7 *"
    - cron: "43 23 * 6,7 *"
    # SCHEDULE:END
  workflow_dispatch:             # manual "Run workflow" is always forced
    inputs:
      force_pursue:
        description: "Also open a polling pursuit now (dry-run the self-chain without waiting for a live match)"
        type: boolean
        default: false
  # Deterministic self-chaining: after a match ends, each run waits ~5 min and
  # re-fires itself via this event (see the `rearm` job), giving on-time polling
  # that does NOT depend on GitHub's flaky scheduler. The chain self-terminates
  # once it catches the new result, and is bootstrapped by the off-peak schedule
  # above. Requires the DISPATCH_PAT secret (a fine-grained PAT with Contents:RW).
  repository_dispatch:
    types: [tick]

permissions:
  contents: write            # commit the snapshot archive + fingerprint back to the repo
  pages: write               # deploy to GitHub Pages
  id-token: write            # required by deploy-pages

concurrency:
  group: winprob
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
      pursue: ${{ steps.plan.outputs.pursue }}
      deadline: ${{ steps.plan.outputs.deadline }}
      attempt: ${{ steps.plan.outputs.attempt }}
      interval: ${{ steps.plan.outputs.interval }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # --- Stage 1 only: cheap collect of the live tournament state (no sims) ---
      - name: Collect live state
        run: python3 wc2026_bet/scripts/collect_live.py

      # --- Change-gate: run the heavy work only on a new result (or a forced run) ---
      - name: Detect new results
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          CUR="$(python3 wc2026_bet/scripts/state_fingerprint.py)"
          PREV="$(cat wc2026_bet/data/live/published.fingerprint 2>/dev/null || true)"
          echo "current=[$CUR] previous=[$PREV] event=$EVENT schedule=$SCHED"
          CHANGED=false; [ "$CUR" != "$PREV" ] && CHANGED=true
          FORCE=false
          if [ "$EVENT" = "workflow_dispatch" ]; then FORCE=true; fi
          if [ "$SCHED" = "17 12 * 6,7 *" ]; then FORCE=true; fi
          if [ "$FORCE" = "true" ] || [ "$CHANGED" = "true" ]; then
            echo "Will run heavy pipeline (force=$FORCE, changed=$CHANGED)."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new results since last publish; skipping heavy pipeline + deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "fp=$CUR" >> "$GITHUB_OUTPUT"

      # --- Plan the self-chain: decide whether to wait ~5 min and re-fire ------ #
      # We "pursue" a fresh result with short-interval polling that we control
      # (deterministic), instead of relying on GitHub's scheduler. A pursuit is
      # opened by any non-forced schedule checkpoint (which sit just after match
      # ends) and is carried forward via repository_dispatch(tick). It STOPS as
      # soon as the result is caught (changed=true) or its deadline passes.
      - name: Plan self-chain
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          DL_IN: ${{ github.event.client_payload.deadline }}
          ATT_IN: ${{ github.event.client_payload.attempt }}
          FORCE_PURSUE: ${{ github.event.inputs.force_pursue }}
          CHANGED: ${{ steps.detect.outputs.changed }}
        run: |
          set -euo pipefail
          NOW="$(date +%s)"
          INTERVAL=240          # ~4 min sleep -> ~5 min effective wall cadence
          MAXMIN=60             # give up a single pursuit after an hour
          DEADLINE=0; ATT=0
          if [ "$EVENT" = "repository_dispatch" ] && [ -n "${DL_IN:-}" ]; then
            DEADLINE="$DL_IN"; ATT="${ATT_IN:-1}"            # carry the chain forward
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${FORCE_PURSUE:-}" = "true" ]; then
            DEADLINE="$(( NOW + MAXMIN * 60 ))"; ATT=0        # manual dry-run of the chain
          elif [ "$EVENT" = "schedule" ] && [ "$SCHED" != "17 12 * 6,7 *" ]; then
            # only open a new pursuit when a match is actually live / just ended
            if [ "$(python3 wc2026_bet/scripts/pursuit_active.py)" = "yes" ]; then
              DEADLINE="$(( NOW + MAXMIN * 60 ))"; ATT=0
            else
              echo "No live/recently-ended match at this checkpoint; not opening a pursuit."
            fi
          fi
          PURSUE=false; ATTEMPT_NEXT=0
          if [ "$DEADLINE" -gt 0 ] && [ "${CHANGED}" != "true" ] && [ "$(( NOW + INTERVAL ))" -lt "$DEADLINE" ]; then
            PURSUE=true; ATTEMPT_NEXT="$(( ATT + 1 ))"
          fi
          echo "pursue=$PURSUE deadline=$DEADLINE attempt=$ATTEMPT_NEXT (event=$EVENT changed=$CHANGED)"
          echo "pursue=$PURSUE" >> "$GITHUB_OUTPUT"
          echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT_NEXT" >> "$GITHUB_OUTPUT"
          echo "interval=$INTERVAL" >> "$GITHUB_OUTPUT"

      - name: Refresh win-probabilities + rebuild shareable page
        if: steps.detect.outputs.run == 'true'
        run: bash run_update.sh --skip-collect

      - name: Assemble published site + timestamped archive
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H%M)"
          mkdir -p published
          cp friends_bet/report/index.html "published/winprob_${TS}.html"
          # the detailed English analyst page (probability table + all charts)
          cp wc2026_bet/report/live.html "published/live_${TS}.html"

          rm -rf public
          mkdir -p public/history
          cp friends_bet/report/index.html public/index.html
          cp friends_bet/report/hero.png   public/hero.png
          cp wc2026_bet/report/live.html  public/live.html
          cp published/*.html public/history/ 2>/dev/null || true

          # auto-generated history index (newest first), separating the two pages
          {
            echo '<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8">'
            echo '<title>היסטוריית עדכונים</title>'
            echo '<body style="font-family:system-ui,Arial;max-width:680px;margin:40px auto;padding:0 16px">'
            echo '<h1>היסטוריית סיכויי זכייה</h1>'
            echo '<p><a href="../index.html">← לעדכון האחרון</a> · <a href="../live.html">הדף המפורט (אנגלית)</a></p>'
            echo '<h2>הדף לשיתוף (עברית)</h2><ul>'
            ls -1r published/winprob_*.html | sed -E 's#published/##' \
              | while read -r f; do echo "<li><a href=\"$f\">$f</a></li>"; done
            echo '</ul><h2>הדף המפורט (אנגלית)</h2><ul>'
            ls -1r published/live_*.html | sed -E 's#published/##' \
              | while read -r f; do echo "<li><a href=\"$f\">$f</a></li>"; done
            echo '</ul></body></html>'
          } > public/history/index.html

      - name: Commit snapshot archive + fingerprint back to repo
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          printf '%s' "${{ steps.detect.outputs.fp }}" > wc2026_bet/data/live/published.fingerprint
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add friends_bet/report/index.html published/ wc2026_bet/data/live/published.fingerprint wc2026_bet/data/history/metrics_history.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "snapshot: win-probabilities update [skip ci]"
            # Another run (or a feature push) may have advanced main while we worked.
            # Retry, reconciling with the remote and keeping our freshly-built artifacts
            # on conflict, so a push race can't fail the run and skip the deploy.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $i) - syncing with origin/main and retrying"
              git pull --no-edit -X ours origin main || true
              sleep $(( (RANDOM % 5) + 2 ))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::could not push snapshot after retries; deploy still proceeds from the built artifact"
            fi
          fi

      - name: Upload Pages artifact
        if: steps.detect.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Deterministic baton pass: runs in parallel with `deploy` (so the deploy is
  # never delayed). It waits one short interval and re-fires the workflow via
  # repository_dispatch(tick), carrying the pursuit deadline forward. The
  # top-level `concurrency` group serialises runs, so the next tick only starts
  # after this run finishes - giving steady ~5-min polling with no overlap and
  # no dependence on GitHub's scheduler. The chain ends when build.pursue=false
  # (result caught, or deadline reached).
  rearm:
    needs: build
    if: needs.build.outputs.pursue == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait one interval, then dispatch the next tick
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
          REPO: ${{ github.repository }}
          INTERVAL: ${{ needs.build.outputs.interval }}
          DEADLINE: ${{ needs.build.outputs.deadline }}
          ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::warning::DISPATCH_PAT secret is not set - self-chaining is disabled."
            echo "Add a fine-grained PAT (Contents: Read and write) as the DISPATCH_PAT secret to enable deterministic polling."
            exit 0
          fi
          echo "Waiting ${INTERVAL}s before firing tick attempt ${ATTEMPT} (pursuit deadline ${DEADLINE})..."
          sleep "${INTERVAL}"
          code="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d "{\"event_type\":\"tick\",\"client_payload\":{\"deadline\":${DEADLINE},\"attempt\":${ATTEMPT}}}")"
          echo "dispatch HTTP ${code}"
          if [ "${code}" != "204" ]; then
            cat /tmp/resp.txt || true
            echo "::error::repository_dispatch failed (HTTP ${code}); the chain will fall back to the schedule."
            exit 1
          fi
          echo "Next tick dispatched."
