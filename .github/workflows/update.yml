name: Update win-probabilities

# Result-triggered refresh with a change-gate. Every run does the CHEAP collect +
# fingerprint and only runs the expensive 50k-sim + deploy when ESPN shows a NEW
# result/goal. The reliable, on-time trigger is an EXTERNAL pinger (e.g. cron-job.org)
# that POSTs repository_dispatch(tick) every ~5 min - GitHub's own scheduler is
# UTC-only and unreliable (it silently drops/delays crons), so the cron entries below
# are kept ONLY as a redundant backup. Near-real-time freshness comes from the pinger.
on:
  schedule:
    # Checks are anchored to real match-end times (+buffers) instead of */15,
    # which GitHub throttles/drops. Each run is the cheap change-gate; it only
    # deploys when a new result appears. Regenerate with scripts/gen_schedule.py.
    # SCHEDULE:START (generated by scripts/gen_schedule.py - do not edit by hand)
    - cron: "17 12 * 6,7 *"   # daily forced odds refresh (dead zone, no matches)
    - cron: "7 0 * 6,7 *"
    - cron: "19 0 * 6,7 *"
    - cron: "43 0 * 6,7 *"
    - cron: "7 1 * 6,7 *"
    - cron: "19 1 * 6,7 *"
    - cron: "37 1 * 6,7 *"
    - cron: "43 1 * 6,7 *"
    - cron: "49 1 * 6,7 *"
    - cron: "7 2 * 6,7 *"
    - cron: "13 2 * 6,7 *"
    - cron: "19 2 * 6,7 *"
    - cron: "37 2 * 6,7 *"
    - cron: "43 2 * 6,7 *"
    - cron: "49 2 * 6,7 *"
    - cron: "7 3 * 6,7 *"
    - cron: "13 3 * 6,7 *"
    - cron: "19 3 * 6,7 *"
    - cron: "37 3 * 6,7 *"
    - cron: "43 3 * 6,7 *"
    - cron: "49 3 * 6,7 *"
    - cron: "7 4 * 6,7 *"
    - cron: "13 4 * 6,7 *"
    - cron: "19 4 * 6,7 *"
    - cron: "43 4 * 6,7 *"
    - cron: "7 5 * 6,7 *"
    - cron: "19 5 * 6,7 *"
    - cron: "43 5 * 6,7 *"
    - cron: "7 6 * 6,7 *"
    - cron: "19 6 * 6,7 *"
    - cron: "43 6 * 6,7 *"
    - cron: "7 18 * 6,7 *"
    - cron: "19 18 * 6,7 *"
    - cron: "43 18 * 6,7 *"
    - cron: "7 19 * 6,7 *"
    - cron: "19 19 * 6,7 *"
    - cron: "43 19 * 6,7 *"
    - cron: "7 20 * 6,7 *"
    - cron: "19 20 * 6,7 *"
    - cron: "43 20 * 6,7 *"
    - cron: "7 21 * 6,7 *"
    - cron: "19 21 * 6,7 *"
    - cron: "43 21 * 6,7 *"
    - cron: "7 22 * 6,7 *"
    - cron: "19 22 * 6,7 *"
    - cron: "37 22 * 6,7 *"
    - cron: "43 22 * 6,7 *"
    - cron: "49 22 * 6,7 *"
    - cron: "7 23 * 6,7 *"
    - cron: "13 23 * 6,7 *"
    - cron: "19 23 * 6,7 *"
    - cron: "43 23 * 6,7 *"
    # SCHEDULE:END
  workflow_dispatch:             # manual "Run workflow" is always forced
  # External pinger heartbeat. A free third-party cron (cron-job.org) POSTs this
  # event every ~5 min; each tick runs the cheap change-gate and deploys only when
  # a new result appears. This is the primary, reliable trigger (no dependence on
  # GitHub's flaky scheduler). The pinger authenticates with a fine-grained PAT
  # (Contents: Read and write) - it is NOT a repo secret; it lives in the pinger.
  repository_dispatch:
    types: [tick]

permissions:
  contents: write            # commit the snapshot archive + fingerprint back to the repo
  pages: write               # deploy to GitHub Pages
  id-token: write            # required by deploy-pages

concurrency:
  group: winprob
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
      slim: ${{ steps.detect.outputs.slim }}
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # --- Stage 1 only: cheap collect of the live tournament state (no sims) ---
      - name: Collect live state
        run: python3 wc2026_bet/scripts/collect_live.py

      # --- Change-gate: heavy work on a new RESULT (or forced); slim refresh on a
      # new LIVE goal (ongoing match) so the leader widgets stay current without a sim ---
      - name: Detect new results
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          CUR="$(python3 wc2026_bet/scripts/state_fingerprint.py)"
          LIVE_CUR="$(python3 wc2026_bet/scripts/state_fingerprint.py --live)"
          PREV="$(cat wc2026_bet/data/live/published.fingerprint 2>/dev/null || true)"
          PREV_LIVE="$(cat wc2026_bet/data/live/published.live.fingerprint 2>/dev/null || true)"
          echo "result=[$CUR vs $PREV] live=[$LIVE_CUR vs $PREV_LIVE] event=$EVENT schedule=$SCHED"
          CHANGED=false; [ "$CUR" != "$PREV" ] && CHANGED=true
          LIVE_CHANGED=false; [ "$LIVE_CUR" != "$PREV_LIVE" ] && LIVE_CHANGED=true
          FORCE=false
          if [ "$EVENT" = "workflow_dispatch" ]; then FORCE=true; fi
          if [ "$SCHED" = "17 12 * 6,7 *" ]; then FORCE=true; fi
          RUN=false; SLIM=false
          if [ "$FORCE" = "true" ] || [ "$CHANGED" = "true" ]; then
            RUN=true
            echo "Heavy pipeline (force=$FORCE, changed=$CHANGED)."
          elif [ "$LIVE_CHANGED" = "true" ] && [ -f wc2026_bet/results/live_latest.json ] \
               && [ -f wc2026_bet/report/live.html ]; then
            SLIM=true
            echo "Slim live-widget refresh (a goal was scored in an ongoing match)."
          else
            echo "No new result and no new live goal; nothing to do."
          fi
          DEPLOY=false; { [ "$RUN" = "true" ] || [ "$SLIM" = "true" ]; } && DEPLOY=true
          echo "run=$RUN"     >> "$GITHUB_OUTPUT"
          echo "slim=$SLIM"   >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "fp=$CUR" >> "$GITHUB_OUTPUT"
          echo "live_fp=$LIVE_CUR" >> "$GITHUB_OUTPUT"

      - name: Refresh win-probabilities + rebuild shareable page
        if: steps.detect.outputs.run == 'true'
        run: bash run_update.sh --skip-collect

      # After a full run, if a *different* match is still in progress, re-overlay the
      # live goal tallies + 'live' badge onto the freshly-built page. Without this the
      # full rebuild would drop the badge until the live match's next goal (its live
      # fingerprint is already == published.live), leaving the widgets looking stale.
      - name: Re-apply live widgets after full run (ongoing match)
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 wc2026_bet/scripts/apply_live_widgets.py
          python3 wc2026_bet/scripts/build_friends_report.py

      # Slim path (no sim): overlay live goal tallies onto the last snapshot and
      # rebuild just the page, so the leader widgets reflect ongoing matches.
      - name: Slim live-widget refresh (no sim)
        if: steps.detect.outputs.run != 'true' && steps.detect.outputs.slim == 'true'
        run: |
          set -euo pipefail
          python3 wc2026_bet/scripts/apply_live_widgets.py
          python3 wc2026_bet/scripts/build_friends_report.py

      - name: Archive timestamped snapshot
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H%M)"
          mkdir -p published
          cp friends_bet/report/index.html "published/winprob_${TS}.html"
          # the detailed English analyst page (probability table + all charts)
          cp wc2026_bet/report/live.html "published/live_${TS}.html"

      - name: Assemble published site
        if: steps.detect.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          mkdir -p published
          rm -rf public
          mkdir -p public/history
          cp friends_bet/report/index.html public/index.html
          cp friends_bet/report/hero.png   public/hero.png
          cp wc2026_bet/report/live.html  public/live.html
          cp published/*.html public/history/ 2>/dev/null || true

          # auto-generated history index (newest first), separating the two pages
          {
            echo '<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8">'
            echo '<title>היסטוריית עדכונים</title>'
            echo '<body style="font-family:system-ui,Arial;max-width:680px;margin:40px auto;padding:0 16px">'
            echo '<h1>היסטוריית סיכויי זכייה</h1>'
            echo '<p><a href="../index.html">← לעדכון האחרון</a> · <a href="../live.html">הדף המפורט (אנגלית)</a></p>'
            echo '<h2>הדף לשיתוף (עברית)</h2><ul>'
            ls -1r published/winprob_*.html | sed -E 's#published/##' \
              | while read -r f; do echo "<li><a href=\"$f\">$f</a></li>"; done
            echo '</ul><h2>הדף המפורט (אנגלית)</h2><ul>'
            ls -1r published/live_*.html | sed -E 's#published/##' \
              | while read -r f; do echo "<li><a href=\"$f\">$f</a></li>"; done
            echo '</ul></body></html>'
          } > public/history/index.html

      - name: Commit snapshot archive + fingerprint back to repo
        if: steps.detect.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          # result fingerprint (unchanged on a slim run) + live-goals fingerprint
          printf '%s' "${{ steps.detect.outputs.fp }}" > wc2026_bet/data/live/published.fingerprint
          printf '%s' "${{ steps.detect.outputs.live_fp }}" > wc2026_bet/data/live/published.live.fingerprint
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add friends_bet/report/index.html published/ \
                  wc2026_bet/data/live/published.fingerprint \
                  wc2026_bet/data/live/published.live.fingerprint \
                  wc2026_bet/data/history/metrics_history.jsonl \
                  wc2026_bet/results/live_latest.json wc2026_bet/report/live.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "snapshot: win-probabilities update [skip ci]"
            # Another run (or a feature push) may have advanced main while we worked.
            # Retry, reconciling with the remote and keeping our freshly-built artifacts
            # on conflict, so a push race can't fail the run and skip the deploy.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $i) - syncing with origin/main and retrying"
              git pull --no-edit -X ours origin main || true
              sleep $(( (RANDOM % 5) + 2 ))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::could not push snapshot after retries; deploy still proceeds from the built artifact"
            fi
          fi

      - name: Upload Pages artifact
        if: steps.detect.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
